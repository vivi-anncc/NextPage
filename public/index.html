
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>BookTrack</h1>
        <p>Your personal reading dashboard</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h2>Book List</h2>
                <p>Books I have read</p>
                <button id="myBooksButton">View My Books</button>
            </div>


            <div class="card">
                <h2>Recommendations</h2>
                <p>Books recommended based on your interests.</p>
                <button>View Recommendations</button>
            </div>

            <div class="card">
                <h2>Reading Calendar</h2>
                <p>Keep track of what you read each day.</p>
                <button>Open Calendar</button>
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>

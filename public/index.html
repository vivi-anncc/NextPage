<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextPage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>NextPage</h1>
        <p> Dashboard</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">

                <h2>My Books</h2>

                <p>Books you've added to your library.</p>

                <form id="bookForm">

                    <label for="bookTitle">Book Title</label>
                    <input type="text" id="bookTitle" required>

                    <label for="bookAuthor">Author</label>
                    <input type="text" id="bookAuthor" required>

                    <button type="submit">Add Book</button>

                </form>

                <button id="readBooksButton">View My Books</button>

                <div id="booksContainer"></div>

            </div>

            <div class="card">

                <h2>Currently Reading</h2>

                <p>You aren't currently reading anything.</p>

                <button>Start Reading</button>

            </div>

            <div class="card">

                <h2>Recommendations</h2>

                <p>Books recommended based on your interests.</p>

                <button>View Recommendations</button>

            </div>

            <div class="card">

                <h2>Reading Calendar</h2>

                <p>Keep track of what you read each day.</p>

                <button>Open Calendar</button>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
